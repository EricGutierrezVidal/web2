name: Deploy FutbolLab
on:
  push:
    branches: [main]
    paths:
      - 'futbol-lab/**'
      - '.github/workflows/push.yml'
  schedule:
    - cron: '17 4,10,16,22 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-deploy:
    concurrency: ci-futbollab
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check futbol-lab/app-v2.js
      - name: Check Python syntax
        run: python -m py_compile futbol-lab/scripts/sync_data.py
      - name: Refresh verified match data (keep fallback if offline)
        run: python futbol-lab/scripts/sync_data.py
      - name: Validate schedules and interface wiring
        run: node futbol-lab/tests/smoke.mjs
      - name: Deploy only FutbolLab
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: futbol-lab
          clean: true
