name: Deploy FutbolLab
on:
  push:
    branches: [main]
    paths:
      - 'futbol-lab/**'
      - '.github/workflows/push.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-deploy:
    concurrency: ci-futbollab
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check futbol-lab/app-v2.js
      - name: Deploy FutbolLab
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: futbol-lab
          clean: true
